<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neighbor Match</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 720px; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, textarea, select { padding: 0.5rem; font-size: 1rem; }
    .error { color: #b00020; }
    .card { background: #f7f7f7; padding: 1.5rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Neighbor Match</h1>
  <p>Join the weekly tenant matching program. We pair neighbors each week so you can connect in person or by email.</p>

  <div class="card">
    <h2>Join the community</h2>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/join">
      <div>
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div>
        <label for="unit">Unit (optional)</label>
        <input id="unit" name="unit" type="text">
      </div>
      <div>
        <label for="bio">Interests (optional)</label>
        <textarea id="bio" name="bio" rows="3"></textarea>
      </div>
      <div>
        <label for="meet_group">Community group</label>
        <select id="meet_group" name="meet_group" required>
          {% for group in groups %}
            <option value="{{ group.name }}">{{ group.displayName }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit">Join</button>
    </form>
  </div>
</body>
</html>
